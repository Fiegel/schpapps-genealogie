# Job exécuté lors d'un MERGE vers main (lance tous les tests et le scan Sonar)
name: Merge to Main Validation

on:
  push:
    branches:
      - main

jobs:
  merge-main-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Requis par Sonar pour le blame Git et l'analyse de code

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run All Tests (TU + TI) and SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=jecash666 \
            -Dsonar.projectKey=Fiegel_schpapps-genealogie \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml
