# Job exécuté lors d'un PUSH (lance les tests unitaires)
name: Java TU on Push

on:
  push:
    branches-ignore:
      - main

jobs:
  unit-tests-on-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn -B clean test
