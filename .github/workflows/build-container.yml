# Job exécuté manuellement : packaging, conteneurisation et publication sur GHCR
name: Build & Publish Docker Image

on:
  workflow_dispatch: # Déclenchement manuel

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Extract Metadata from POM & UTC Date
        id: meta
        run: |
          # Extraction de l'artifactId et de la version depuis le pom.xml
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          # Horodatage au format UTC (ex: 20260904-143059)
          DATE_UTC=$(date -u +'%Y%m%d-%H%M%S')
          
          # Tag complet : schpapps-genealogie-1.0.0-snapshot-20260904-143059
          FULL_TAG="${ARTIFACT_ID}-${VERSION}-${DATE_UTC}"
          
          # Normalisation en minuscules pour respecter les normes Docker
          CLEAN_TAG=$(echo "${FULL_TAG}" | tr '[:upper:]' '[:lower:]')
          
          # Export des variables pour les étapes suivantes
          echo "tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Package Quarkus App
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:latest